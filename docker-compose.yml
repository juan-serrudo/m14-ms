services:
  # ============================================
  # INFRAESTRUCTURA KEYCLOAK (OAuth2/SSO)
  # ============================================

  # Base de datos PostgreSQL para Keycloak
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak - Authorization Server
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_password
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8090:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ============================================
  # INFRAESTRUCTURA KAFKA
  # ============================================

  # Zookeeper - Requerido por Kafka para coordinación
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka-broker:
    image: bitnamilegacy/kafka:3.6
    container_name: kafka-broker
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker:9092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Kafka Init - Crea los topics necesarios al arrancar
  kafka-init:
    image: bitnamilegacy/kafka:3.6
    container_name: kafka-init
    depends_on:
      kafka-broker:
        condition: service_healthy
    networks:
      - microservices-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Esperando a que Kafka esté disponible..."
        until kafka-topics.sh --bootstrap-server kafka-broker:9092 --list; do
          echo "Kafka no está disponible aún, esperando..."
          sleep 2
        done
        echo "Kafka está disponible, creando topics..."
        # Crear topic user-events (idempotente: si existe, no falla)
        kafka-topics.sh --bootstrap-server kafka-broker:9092 \
          --create --if-not-exists \
          --topic user-events \
          --partitions 3 \
          --replication-factor 1 || echo "Topic user-events ya existe o error al crearlo"
        echo "Topics creados exitosamente"
        kafka-topics.sh --bootstrap-server kafka-broker:9092 --list
  # Microservicio Users - Réplica 1
  # NOTA: Comparte el mismo volumen (users-db) con users-service-2
  # para que ambas réplicas vean la misma base de datos SQLite
  users-service-1:
    build:
      context: ./microservices/users
      dockerfile: Dockerfile
    container_name: users-service-1
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ENV_ENTORNO=prod
      - ENV_SYNCHRONIZE=true
      - ENV_SWAGGER_SHOW=false
      - DATABASE_PATH=/app/data/users.sqlite
      - KAFKA_BROKER=kafka-broker:9092
      - KAFKA_CLIENT_ID=users-service-1
      - KAFKA_USER_EVENTS_TOPIC=user-events
      - KEYCLOAK_AUTH_URL=http://keycloak:8080
      - KEYCLOAK_REALM=microservices-realm
      - KEYCLOAK_CLIENT_ID=users-service
      - KEYCLOAK_CLIENT_SECRET=users-service-secret-12345
      - JWT_AUDIENCE=users-service
      - JWT_ISSUER=http://keycloak:8080/realms/microservices-realm
    volumes:
      - users-db:/app/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservicio Users - Réplica 2
  # NOTA: Comparte el mismo volumen (users-db) con users-service-1
  # para que ambas réplicas vean la misma base de datos SQLite
  users-service-2:
    build:
      context: ./microservices/users
      dockerfile: Dockerfile
    container_name: users-service-2
    ports:
      - "3002:3001"
    environment:
      - PORT=3001
      - ENV_ENTORNO=prod
      - ENV_SYNCHRONIZE=true
      - ENV_SWAGGER_SHOW=false
      - DATABASE_PATH=/app/data/users.sqlite
      - KAFKA_BROKER=kafka-broker:9092
      - KAFKA_CLIENT_ID=users-service-2
      - KAFKA_USER_EVENTS_TOPIC=user-events
      - KEYCLOAK_AUTH_URL=http://keycloak:8080
      - KEYCLOAK_REALM=microservices-realm
      - KEYCLOAK_CLIENT_ID=users-service
      - KEYCLOAK_CLIENT_SECRET=users-service-secret-12345
      - JWT_AUDIENCE=users-service
      - JWT_ISSUER=http://keycloak:8080/realms/microservices-realm
    volumes:
      - users-db:/app/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Load Balancer NGINX para Users
  users-service-lb:
    build:
      context: ./infra/users-lb
      dockerfile: Dockerfile
    container_name: users-service-lb
    ports:
      - "8080:80"
    depends_on:
      - users-service-1
      - users-service-2
      - kafka-init
      - keycloak
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Microservicio Password
  # NOTA: Usa un único volumen (password-db) para la base de datos SQLite.
  # Si en el futuro se añaden réplicas de password-service, todas deben
  # montar el mismo volumen password-db para compartir la misma BD.
  password-service:
    build:
      context: ./microservices/password
      dockerfile: Dockerfile
    container_name: password-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENV_ENTORNO=prod
      - ENV_SYNCHRONIZE=true
      - ENV_SWAGGER_SHOW=false
      - USER_SERVICE_BASE_URL=http://users-service-lb
      - DATABASE_PATH=/app/data/password.sqlite
      - KAFKA_BROKER=kafka-broker:9092
      - KAFKA_CLIENT_ID=password-service
      - KAFKA_USER_EVENTS_TOPIC=user-events
      - KAFKA_GROUP_ID=password-service-group
      - KEYCLOAK_AUTH_URL=http://keycloak:8080
      - KEYCLOAK_REALM=microservices-realm
      - KEYCLOAK_CLIENT_ID=password-service
      - KEYCLOAK_CLIENT_SECRET=password-service-secret-12345
    volumes:
      - password-db:/app/data
    depends_on:
      - users-service-lb
      - kafka-init
      - keycloak
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8081:80"
    depends_on:
      - password-service
      - users-service-lb
      - kafka-init
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  # Volumen compartido para ambas réplicas de users-service
  # Ambas réplicas (users-service-1 y users-service-2) montan este volumen
  # en /app/data para compartir la misma base de datos SQLite (users.sqlite)
  users-db:
    driver: local
  # Volumen único para password-service
  # Si se añaden réplicas en el futuro, todas deben montar este mismo volumen
  password-db:
    driver: local
  # Volumen para la base de datos de Keycloak
  keycloak-db-data:
    driver: local

